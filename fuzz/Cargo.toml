[package]
name = "treasury-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
treasury-evidence = { path = "../crates/treasury-evidence" }

# Kept out of the main workspace: cargo-fuzz needs a nightly toolchain and
# sanitizer flags the stable workspace never sees.
[workspace]
members = ["."]

[[bin]]
name = "canonical_json"
path = "fuzz_targets/canonical_json.rs"
test = false
doc = false
bench = false
